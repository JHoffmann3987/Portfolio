<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#56d364" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#14161a"/>

  <!-- MSP technician -->
  <rect x="350" y="20" width="200" height="60" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
  <text x="450" y="45" text-anchor="middle" fill="#e8e9ea" font-size="14">IT Technician</text>
  <text x="450" y="65" text-anchor="middle" fill="#8b9098" font-size="12">Managed Service Provider</text>

  <line x1="450" y1="80" x2="450" y2="158" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Client tenant container -->
  <rect x="60" y="160" width="780" height="290" rx="16" fill="#1a1d22" stroke="#363c44" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="90" y="196" fill="#b8bcc2" font-size="13">Client tenant environment — repeated per business client</text>

  <!-- 4 admin domain boxes -->
  <g>
    <rect x="93" y="220" width="160" height="140" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="173" y="278" text-anchor="middle" fill="#e8e9ea" font-size="14">Entra ID</text>
    <text x="173" y="298" text-anchor="middle" fill="#8b9098" font-size="12">Identity &amp; MFA</text>
  </g>

  <g>
    <rect x="278" y="220" width="160" height="140" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="358" y="270" text-anchor="middle" fill="#e8e9ea" font-size="14">Exchange</text>
    <text x="358" y="288" text-anchor="middle" fill="#e8e9ea" font-size="14">Online</text>
    <text x="358" y="308" text-anchor="middle" fill="#8b9098" font-size="12">Mail flow</text>
  </g>

  <g>
    <rect x="463" y="220" width="160" height="140" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="543" y="270" text-anchor="middle" fill="#e8e9ea" font-size="14">Endpoint</text>
    <text x="543" y="288" text-anchor="middle" fill="#e8e9ea" font-size="14">Security</text>
    <text x="543" y="308" text-anchor="middle" fill="#8b9098" font-size="12">Intune, MDE</text>
  </g>

  <g>
    <rect x="648" y="220" width="160" height="140" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="728" y="270" text-anchor="middle" fill="#e8e9ea" font-size="14">Licensing</text>
    <text x="728" y="288" text-anchor="middle" fill="#e8e9ea" font-size="14">&amp; Billing</text>
    <text x="728" y="308" text-anchor="middle" fill="#8b9098" font-size="12">Per-seat mgmt</text>
  </g>

  <text x="450" y="410" text-anchor="middle" fill="#8b9098" font-size="12">Every client runs the same admin surface — onboarding, offboarding,</text>
  <text x="450" y="428" text-anchor="middle" fill="#8b9098" font-size="12">and troubleshooting repeat consistently across each tenant</text>
