<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#56d364" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#14161a"/>

  <!-- Internet -->
  <rect x="370" y="20" width="160" height="50" rx="10" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="450" y="50" text-anchor="middle" fill="#b8bcc2" font-size="14">Internet / WAN</text>

  <line x1="450" y1="70" x2="450" y2="108" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Firewall -->
  <rect x="360" y="110" width="180" height="60" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
  <text x="450" y="135" text-anchor="middle" fill="#e8e9ea" font-size="14">SonicWall</text>
  <text x="450" y="155" text-anchor="middle" fill="#8b9098" font-size="12">Firewall &amp; rules</text>

  <line x1="450" y1="170" x2="450" y2="208" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Managed switch -->
  <rect x="360" y="210" width="180" height="60" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
  <text x="450" y="235" text-anchor="middle" fill="#e8e9ea" font-size="14">Managed Switch</text>
  <text x="450" y="255" text-anchor="middle" fill="#8b9098" font-size="12">802.1Q trunking</text>

  <!-- fan lines to VLANs -->
  <line x1="450" y1="270" x2="173" y2="318" stroke="#3fb950" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="450" y1="270" x2="358" y2="318" stroke="#3fb950" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="450" y1="270" x2="543" y2="318" stroke="#3fb950" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="450" y1="270" x2="728" y2="318" stroke="#3fb950" stroke-width="1" marker-end="url(#arrow3)"/>

  <!-- VLAN boxes -->
  <g>
    <rect x="93" y="320" width="160" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="173" y="368" text-anchor="middle" fill="#e8e9ea" font-size="14">VLAN 10</text>
    <text x="173" y="388" text-anchor="middle" fill="#8b9098" font-size="12">Trusted</text>
  </g>

  <g>
    <rect x="278" y="320" width="160" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="358" y="368" text-anchor="middle" fill="#e8e9ea" font-size="14">VLAN 20</text>
    <text x="358" y="388" text-anchor="middle" fill="#8b9098" font-size="12">Guest</text>
  </g>

  <g>
    <rect x="463" y="320" width="160" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="543" y="368" text-anchor="middle" fill="#e8e9ea" font-size="14">VLAN 30</text>
    <text x="543" y="388" text-anchor="middle" fill="#8b9098" font-size="12">IoT / Lab</text>
  </g>

  <g>
    <rect x="648" y="320" width="160" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="728" y="368" text-anchor="middle" fill="#e8e9ea" font-size="14">VLAN 40</text>
    <text x="728" y="388" text-anchor="middle" fill="#8b9098" font-size="12">Servers</text>
  </g>

  <text x="450" y="480" text-anchor="middle" fill="#8b9098" font-size="12">Each VLAN gets its own subnet, DHCP scope, and firewall rules —</text>
  <text x="450" y="498" text-anchor="middle" fill="#8b9098" font-size="12">segmenting trusted, guest, IoT, and server traffic</text>
</svg>
