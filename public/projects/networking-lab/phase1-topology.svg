<svg viewBox="0 0 1800 720" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrowN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b9098" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#56d364" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1800" height="720" fill="#14161a"/>

  <!-- Internet -->
  <rect x="670" y="20" width="160" height="50" rx="8" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="750" y="50" text-anchor="middle" fill="#e8e9ea" font-size="15">Internet</text>

  <line x1="750" y1="70" x2="750" y2="108" stroke="#8b9098" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- TP-Link -->
  <rect x="630" y="110" width="240" height="70" rx="10" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="750" y="140" text-anchor="middle" fill="#e8e9ea" font-size="15">TP-Link Router</text>
  <text x="750" y="160" text-anchor="middle" fill="#8b9098" font-size="12">NAT &#183; DHCP &#183; Wi-Fi</text>

  <line x1="750" y1="180" x2="300" y2="228" stroke="#8b9098" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="750" y1="180" x2="1050" y2="228" stroke="#8b9098" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- Household Wi-Fi -->
  <rect x="150" y="230" width="300" height="70" rx="10" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="300" y="260" text-anchor="middle" fill="#e8e9ea" font-size="15">Household Wi-Fi</text>
  <text x="300" y="280" text-anchor="middle" fill="#8b9098" font-size="12">Untagged &#183; VLAN 1 (phones, TVs)</text>

  <!-- Switch -->
  <rect x="900" y="230" width="300" height="70" rx="10" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="1050" y="260" text-anchor="middle" fill="#e8e9ea" font-size="15">Managed Switch</text>
  <text x="1050" y="280" text-anchor="middle" fill="#8b9098" font-size="12">Netgear GS108Ev4 &#183; 802.1Q trunk</text>

  <line x1="1050" y1="300" x2="1010" y2="348" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="1050" y1="300" x2="1310" y2="348" stroke="#8b9098" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <!-- Admin PC (MGMT) -->
  <rect x="900" y="350" width="220" height="70" rx="10" fill="#1c1f24" stroke="#d29922" stroke-width="1.25"/>
  <text x="1010" y="380" text-anchor="middle" fill="#e8e9ea" font-size="15">Admin PC</text>
  <text x="1010" y="400" text-anchor="middle" fill="#e3b341" font-size="12">Access port &#183; VLAN 10 (MGMT)</text>

  <!-- Proxmox host container -->
  <rect x="1160" y="350" width="300" height="230" rx="16" fill="#1a1d22" stroke="#363c44" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="1185" y="378" fill="#b8bcc2" font-size="13">Proxmox Host &#8212; trunk port</text>

  <!-- Jellyfin -->
  <rect x="1185" y="400" width="120" height="90" rx="10" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="1245" y="438" text-anchor="middle" fill="#e8e9ea" font-size="14">Jellyfin</text>
  <text x="1245" y="456" text-anchor="middle" fill="#8b9098" font-size="11">LXC &#183; untagged</text>

  <!-- OPNsense -->
  <rect x="1325" y="400" width="120" height="90" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1.25"/>
  <text x="1385" y="438" text-anchor="middle" fill="#e8e9ea" font-size="14">OPNsense</text>
  <text x="1385" y="456" text-anchor="middle" fill="#7ee787" font-size="11">Firewall VM</text>

  <line x1="1445" y1="445" x2="1498" y2="445" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- VM 100 / SERVERS -->
  <rect x="1500" y="400" width="220" height="90" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1.25"/>
  <text x="1610" y="438" text-anchor="middle" fill="#e8e9ea" font-size="15">VM 100</text>
  <text x="1610" y="458" text-anchor="middle" fill="#7ee787" font-size="12">SERVERS &#183; 10.0.20.10</text>

  <!-- Caption / legend -->
  <text x="80" y="640" fill="#8b9098" font-size="13">Firewall rules: MGMT can reach everything. SERVERS and IOT are blocked from reaching MGMT.</text>
  <text x="80" y="662" fill="#8b9098" font-size="13">IOT (VLAN 40, 10.0.40.0/24) is reserved and not yet populated.</text>

  <g>
    <rect x="80" y="682" width="14" height="14" rx="3" fill="#1c1f24" stroke="#d29922" stroke-width="1.25"/>
    <text x="102" y="693" fill="#8b9098" font-size="12">MGMT &#183; VLAN 10</text>
  </g>
  <g>
    <rect x="230" y="682" width="14" height="14" rx="3" fill="#1c1f24" stroke="#3fb950" stroke-width="1.25"/>
    <text x="252" y="693" fill="#8b9098" font-size="12">SERVERS &#183; VLAN 20</text>
  </g>
  <g>
    <rect x="400" y="682" width="14" height="14" rx="3" fill="#1c1f24" stroke="#363c44" stroke-width="1.25"/>
    <text x="422" y="693" fill="#8b9098" font-size="12">Untagged / physical</text>
  </g>
</svg>
