<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#56d364" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="#14161a"/>

  <!-- LAN access -->
  <rect x="620" y="10" width="140" height="50" rx="8" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
  <text x="690" y="30" text-anchor="middle" fill="#7ee787" font-size="13">LAN / Local</text>
  <text x="690" y="48" text-anchor="middle" fill="#7ee787" font-size="13">Network</text>

  <line x1="690" y1="60" x2="690" y2="298" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Proxmox host -->
  <rect x="40" y="100" width="820" height="560" rx="20" fill="#1a1d22" stroke="#363c44" stroke-width="1"/>
  <text x="70" y="140" fill="#e8e9ea" font-size="16" font-weight="bold">Proxmox VE Host</text>

  <!-- Ubuntu Server VM -->
  <rect x="80" y="170" width="740" height="460" rx="16" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="110" y="205" fill="#b8bcc2" font-size="14">Ubuntu Server VM</text>

  <!-- Docker Engine -->
  <rect x="120" y="235" width="660" height="360" rx="12" fill="#202429" stroke="#3fb950" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="150" y="266" fill="#56d364" font-size="14">Docker Engine</text>

  <!-- Service boxes -->
  <g>
    <rect x="140" y="300" width="140" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="210" y="352" text-anchor="middle" fill="#e8e9ea" font-size="14">Homepage</text>
    <text x="210" y="372" text-anchor="middle" fill="#8b9098" font-size="11">Dashboard</text>
  </g>

  <g>
    <rect x="300" y="300" width="140" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="370" y="352" text-anchor="middle" fill="#e8e9ea" font-size="14">Jellyfin</text>
    <text x="370" y="372" text-anchor="middle" fill="#8b9098" font-size="11">Media server</text>
  </g>

  <g>
    <rect x="460" y="300" width="140" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="530" y="352" text-anchor="middle" fill="#e8e9ea" font-size="14">Vaultwarden</text>
    <text x="530" y="372" text-anchor="middle" fill="#8b9098" font-size="11">Passwords</text>
  </g>

  <g>
    <rect x="620" y="300" width="140" height="120" rx="10" fill="#1c1f24" stroke="#3fb950" stroke-width="1"/>
    <text x="690" y="345" text-anchor="middle" fill="#e8e9ea" font-size="14">Nginx Proxy</text>
    <text x="690" y="363" text-anchor="middle" fill="#e8e9ea" font-size="14">Manager</text>
    <text x="690" y="383" text-anchor="middle" fill="#8b9098" font-size="11">Reverse proxy</text>
  </g>

  <!-- storage/network line -->
  <rect x="140" y="470" width="620" height="90" rx="10" fill="#1c1f24" stroke="#363c44" stroke-width="1"/>
  <text x="450" y="500" text-anchor="middle" fill="#b8bcc2" font-size="13">Docker Compose</text>
  <text x="450" y="522" text-anchor="middle" fill="#8b9098" font-size="12">Each service defined and versioned as its own stack —</text>
  <text x="450" y="542" text-anchor="middle" fill="#8b9098" font-size="12">rebuildable from a single file</text>
</svg>
